name: Deploy VitePress site to Pages

on:
  push:
    branches: [KernelSU_on_Huawei]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache npm dependencies
        uses: actions/cache@v3
        id: npm-cache
        with:
          path: |
            ~/.npm
            webside/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('webside/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Verify file structure
        run: |
          echo "=== 检查文件结构 ==="
          echo "当前目录: $(pwd)"
          echo "webside 目录内容:"
          ls -la webside/ || echo "webside 目录不存在"
          echo "=== 检查 package-lock.json ==="
          if [ -f "webside/package-lock.json" ]; then
            echo "✓ 找到 package-lock.json"
          else
            echo "✗ 未找到 package-lock.json，尝试生成..."
            cd webside && npm init -y && npm install vitepress --save-dev
          fi

      - name: Install dependencies
        run: |
          cd webside
          npm ci

      - name: Build with VitePress
        run: |
          cd webside
          npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webside/.vitepress/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
