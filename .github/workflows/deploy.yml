name: Deploy VitePress site to Pages

on:
  push:
    branches: [KernelSU_onHuawei]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 使用 v3 版本并禁用缓存
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: false  # 显式禁用缓存

      - name: Install dependencies
        run: |
          cd webside
          npm install

      - name: Build with VitePress
        run: |
          cd webside
          npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webside/.vitepress/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
