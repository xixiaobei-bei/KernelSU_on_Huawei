name: Deploy to GitHub Pages

on:
  push:
    branches: [KernelSU_onHuawei]
    paths:
      - 'webside/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: |
          cd webside
          npm install
          
      - name: Build
        run: |
          cd webside
          npm run docs:build
          
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: webside/.vitepress/dist
          destination_dir: .  # 部署到根目录
