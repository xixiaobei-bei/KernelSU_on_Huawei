name: Deploy VitePress site to Pages

on:
  push:
    branches: [KernelSU_onHuawei]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          # 修改这里：指向 webside 目录下的 package-lock.json
          cache-dependency-path: 'webside/package-lock.json'

      - name: Install dependencies
        run: |
          cd webside
          npm ci  # 使用 npm ci 而不是 npm install，这样会严格按照 package-lock.json

      - name: Build with VitePress
        run: |
          cd webside
          npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webside/.vitepress/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
