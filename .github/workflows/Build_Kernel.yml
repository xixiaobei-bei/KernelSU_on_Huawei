name: Build_Kernel
on:
  workflow_dispatch:
  push:
    branches:
      - MHA_EMUI9.0_KernelSU
      - MHA_EMUI9.0_KernelSU-Next
      - MHA_EMUI9.0_SukiSU-Ultra
      - MHA_HarmonyOS2.0_KernelSU
      - MHA_HarmonyOS2.0_KernelSU-Next
      - MHA_HarmonyOS2.0_SukiSU-Ultra
  pull_request:
    branches:
      - MHA_EMUI9.0_KernelSU
      - MHA_EMUI9.0_KernelSU-Next
      - MHA_EMUI9.0_SukiSU-Ultra
      - MHA_HarmonyOS2.0_KernelSU
      - MHA_HarmonyOS2.0_KernelSU-Next
      - MHA_HarmonyOS2.0_SukiSU-Ultra

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      options: --privileged
    timeout-minutes: 480
    strategy:
      matrix:
        branch:
          - MHA_EMUI9.0_KernelSU
          - MHA_EMUI9.0_KernelSU-Next
          - MHA_EMUI9.0_SukiSU-Ultra
          - MHA_HarmonyOS2.0_KernelSU
          - MHA_HarmonyOS2.0_KernelSU-Next
          - MHA_HarmonyOS2.0_SukiSU-Ultra
        pm: [false, true]
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"
      KERNEL_CMDLINE: "ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out"
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        ref: ${{ matrix.branch }}
        submodules: false
        fetch-depth: 1
        lfs: false

    - name: Install dependencies
      run: |
        ln -snf /usr/share/zoneinfo/$TZ /etc/localtime && echo $TZ > /etc/timezone
        apt-get update -y 
        apt install --no-install-recommends bash sudo binutils make python2 libssl-dev flex unzip libssl-dev ca-certificates xz-utils mkbootimg cpio device-tree-compiler git git-lfs bc bison build-essential ccache curl flex g++-9 gcc-9 git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev -y
        sudo ln -sf /bin/bash /bin/sh
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 aarch64-linux-android-4.9

    - name: Prepare KernelSU sources (branch-specific)
      run: |
        BRANCH='${{ matrix.branch }}'
        if [[ "$BRANCH" == *"KernelSU"* ]]; then
          echo "Branch contains KernelSU: running KernelSU main setup"
          rm -rf KernelSU
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
        elif [[ "$BRANCH" == *"KernelSU-Next"* ]]; then
          echo "Branch contains KernelSU-Next: running KernelSU-Next setup"
          rm -rf KernelSU-Next
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
        elif [[ "$BRANCH" == *"SukiSU-Ultra"* ]]; then
          rm -rf KernelSU
          echo "Branch contains SukiSU-Ultra: running SukiSU-Ultra setup"
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
        else
          echo "No KernelSU-related branch pattern matched; skipping vendor kernel setup"
        fi

    - name: Set build vars
      run: |
        if [ "${{ matrix.pm }}" = "true" ]; then
          echo "PM_SUFFIX=_PM" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=${{ matrix.branch }}_PM" >> $GITHUB_ENV
        else
          echo "PM_SUFFIX=" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=${{ matrix.branch }}" >> $GITHUB_ENV
        fi

        BRANCH='${{ matrix.branch }}'
        case "$BRANCH" in
          MHA_EMUI9.0_KernelSU)
            DEFCONFIG="merge_hi3660_defconfig" ;;
          MHA_EMUI9.0_KernelSU-Next)
            DEFCONFIG="merge_hi3660_defconfig" ;;
          MHA_EMUI9.0_SukiSU-Ultra)
            DEFCONFIG="merge_hi3660_defconfig" ;;
          MHA_HarmonyOS2.0_KernelSU)
            DEFCONFIG="merge_hi3660_defconfig" ;;
          MHA_HarmonyOS2.0_KernelSU-Next)
            DEFCONFIG="merge_hi3660_defconfig" ;;
          MHA_HarmonyOS2.0_SukiSU-Ultra)
            DEFCONFIG="merge_hi3660_defconfig" ;;
          EVA_EMUI8.0_KernelSU)
            DEFCONFIG="merge_hi3650_defconfig" ;;
        esac

        if [ -z "$DEFCONFIG" ]; then
          echo "::error::DEFCONFIG is empty for branch $BRANCH. Please set mapping in workflow 'Set build vars' step." >&2
          exit 1
        fi

        echo "DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV

    - name: Build Kernel for ${{ matrix.branch }} (pm=${{ matrix.pm }})
      run: |
        sudo ln -sf /usr/bin/python2.7 /usr/bin/python

        if [ -d include/config ]; then
          echo "Find config, will remove it"
          rm -rf include/config
        else
          echo "No Config, good."
        fi

        export PATH=$PATH:$(pwd)/aarch64-linux-android-4.9/bin/
        export CROSS_COMPILE=aarch64-linux-android-
        sudo chmod -R 777 $(pwd)/

        if [ "${{ matrix.pm }}" = "true" ]; then
          sed -i 's/^# CONFIG_SECURITY_SELINUX_DEVELOP is not set$/CONFIG_SECURITY_SELINUX_DEVELOP=y/' "$DEFCONFIG" || true
          sed -i 's/^\(CONFIG_LOCALVERSION="[^"]*\)_\([^"]*"\)$/\1_PM_\2/' "$DEFCONFIG" || true
          if ! grep -q '_PM_' "$DEFCONFIG"; then
            sed -i 's/^CONFIG_LOCALVERSION="\(.*\)"$/CONFIG_LOCALVERSION="\1_PM"/' "$DEFCONFIG" || true
          fi
        fi

        make clean
        make distclean
        make mrproper
        rm -rf out
        make ARCH=arm64 O=out "${DEFCONFIG}"
        make ARCH=arm64 O=out -j$(nproc --all)

        CURRENT_DATE=$(date +'%Y-%m-%d')
        tools/mkbootimg --kernel out/arch/arm64/boot/Image.gz --base 0x0 --cmdline "loglevel=4 initcall_debug=n page_tracker=on slub_min_objects=16 unmovable_isolate1=2:192M,3:224M,4:256M printktimer=0xfff0a000,0x534,0x538 androidboot.selinux=$(if [ "${{ matrix.pm }}" = "true" ]; then echo "permissive"; else echo "enforcing"; fi) buildvariant=user" --tags_offset 0x07A00000 --kernel_offset 0x00080000 --ramdisk_offset 0x07c00000 --header_version 1 --os_version 9 --os_patch_level $CURRENT_DATE --output ${ARTIFACT_NAME}.img

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: "${{ env.ARTIFACT_NAME }}.img"
