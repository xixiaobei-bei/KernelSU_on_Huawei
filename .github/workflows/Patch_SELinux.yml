name: Apply Patch Once (Hardcoded Branches)

on:
  workflow_dispatch:

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Apply patch to all hardcoded branches
        run: |
          # ---------- 硬编码的分支列表 ----------
          branches=(
            "VCE_HarmonyOS3.0_RKSU"
            "PAR_HarmonyOS2.0_RKSU"
            "NEO_EMUI9.0_RKSU"
            "SEA-AL10-TEST"
            "SEA-AL00-TL00_EMUI9.1_RKSU"
            "SEA-AL10-TL10-TL10HKA_EMUI9.1_ReSukiSU"
            "LYA_EMUI9.0_RKSU"
            "INE_EMUI9.1_RKSU"
            "EML_EMUI9.1_KernelSU"
            "VCE_EMUI9.0_SukiSU-Ultra"
            "VCE_EMUI9.0_KernelSU"
            "MHA_HarmonyOS2.0_SukiSU-Ultra"
            "MHA_HarmonyOS2.0_KernelSU"
            "MHA_EMUI9.0_SukiSU-Ultra"
            "MHA_EMUI9.0_SukiSU-Ultra_SuSFS_KPM"
            "MHA_EMUI9.0_ReSukiSU"
            "CPN_LineageOS17.1_KernelSU-Next"
            "BND_EMUI9.1_RKSU"
            "ALP_EMUI9.0_RKSU"
            "MAR_EMUI10.0_RKSU"
            "VKY_EMUI9.0_RKSU"
            "VKY_HarmonyOS2.0_RKSU"
            "MHA_EMUI9.0_KernelSU-Next"
            "MHA_HarmonyOS2.0_KernelSU-Next"
            "GLK_EMUI9.1_RKSU"
            "ALP_EMUI9.1_RKSU"
            "MHA_EMUI9.0_ReSukiSU_SuSFS_KPM"
            "CDY_HarmonyOS2.0_KernelSU"
            "MHA_HarmonyOS2.0_SuSFS_KPM"
            "DUK_HarmonyOS2.0_KernelSU"
            "JKM_EMUI9.1_KernelSU"
            "JKM_HarmonyOS2.0_KernelSU"
            "MHA_EMUI9.0_KernelSU"
            "MHA_EMUI9.0_RKSU"
            "MHA_HarmonyOS2.0_RKSU"
            "MHA_HarmonyOS2.0_ReSukiSU"
            "STF_EMUI9.0_KernelSU"
            "STK_EMUI9.1_RKSU"
            "VTR_EMUI9.0_KernelSU"
            "VTR_EMUI9.1_KernelSU"
            "VTR_HarmonyOS2.0_KernelSU"
            "ALP_EMUI9.0_KernelSU"
            "BLA_EMUI9.1_KernelSU"
            "BLA_EMUI10.0_KernelSU"
            "ELE_HarmonyOS2.0_KernelSU"
            "EVA_EMUI8.0_KernelSU"
          )

          # ---------- 检测标记 ----------
          MARKER='security_secctx_to_secid("u:r:su:s0", strlen("u:r:su:s0"), &ksu_sid);'

          # ---------- 定义补丁内容（将在循环内生成） ----------
          PATCH_CONTENT=$(cat <<'EOF'
          diff -uNr a/security/selinux/hooks.c b/security/selinux/hooks.c
          --- a/security/selinux/hooks.c	2019-02-27 18:31:35.000000000 +0800
          +++ b/security/selinux/hooks.c	2026-08-28 13:30:21.276759515 +0800
          @@ -2291,16 +2291,37 @@
          			    const struct task_security_struct *old_tsec,
          			    const struct task_security_struct *new_tsec)
           {
          +#ifdef CONFIG_KSU
          +    static u32 ksu_sid;
          +    char *secdata;
          +#endif
          	int nnp = (bprm->unsafe & LSM_UNSAFE_NO_NEW_PRIVS);
          	int nosuid = !mnt_may_suid(bprm->file->f_path.mnt);
          	int rc;
           
          +#ifdef CONFIG_KSU
          +    int error;
          +    u32 seclen;
          +#endif
          	if (!nnp && !nosuid)
          		return 0; /* neither NNP nor nosuid */
          
          	if (new_tsec->sid == old_tsec->sid)
          		return 0; /* No change in credentials */
          
          +#ifdef CONFIG_KSU
          +    if (!ksu_sid)
          +        security_secctx_to_secid("u:r:su:s0", strlen("u:r:su:s0"), &ksu_sid);
          +
          +    error = security_secid_to_secctx(old_tsec->sid, &secdata, &seclen);
          +    if (!error) {
          +        rc = strcmp("u:r:init:s0", secdata);
          +        security_release_secctx(secdata, seclen);
          +        if (rc == 0 && new_tsec->sid == ksu_sid)
          +            return 0;
          +    }
          +#endif
          +
          	/*
          	 * The only transitions we permit under NNP or nosuid
          	 * are transitions to bounded SIDs, i.e. SIDs that are
          EOF
          )

          # ---------- 遍历分支 ----------
          for branch in "${branches[@]}"; do
            echo "🔄 Processing branch: $branch"

            # 检查远程是否存在
            if ! git ls-remote --exit-code --heads origin "$branch" > /dev/null 2>&1; then
              echo "⚠️  Branch $branch does not exist on remote, skipping"
              continue
            fi

            # 切换或创建本地跟踪分支
            if git show-ref --verify --quiet refs/heads/$branch; then
              git checkout $branch
            else
              git checkout -b $branch origin/$branch
            fi

            # ---------- 在当前分支下重新生成补丁文件 ----------
            echo "$PATCH_CONTENT" > my.patch

            # 检查目标文件是否已经包含特征行
            TARGET_FILE="security/selinux/hooks.c"
            if [ -f "$TARGET_FILE" ] && grep -qF "$MARKER" "$TARGET_FILE"; then
              echo "✅ Branch $branch already contains the patch (marker found), skipping"
              git checkout main 2>/dev/null || git checkout master 2>/dev/null || git checkout -B temp
              continue
            fi

            # 尝试应用补丁 (使用 patch 命令)
            if patch -p1 --dry-run < my.patch > /dev/null 2>&1; then
              # 实际应用
              patch -p1 < my.patch
              # 检查是否有变更
              if git diff --quiet; then
                echo "✅ No changes to commit on $branch"
              else
                # 只添加修改的文件（hooks.c），避免将 my.patch 加入仓库
                git add "$TARGET_FILE"
                git commit -m "Apply security patch (KSU) to $branch"
                git push origin $branch
                echo "🚀 Patch applied and pushed to $branch"
              fi
            else
              echo "⚠️  Patch cannot be applied cleanly on $branch, skipping"
            fi

            # 清理补丁文件，避免影响下一个分支（可选）
            rm -f my.patch

            # 切回默认分支（使用 -B 强制重置 temp）
            git checkout main 2>/dev/null || git checkout master 2>/dev/null || git checkout -B temp
          done